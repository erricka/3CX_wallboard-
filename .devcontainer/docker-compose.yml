# Codespaces / dev container: the app container plus a PostgreSQL database.
services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    # Share the database container's network: Codespaces only forwards ports
    # (forwardPorts in devcontainer.json) set up this way; otherwise the
    # browser gets HTTP 502. PostgreSQL is then reachable on localhost.
    network_mode: service:db
    environment:
      DATABASE_URL: postgresql+asyncpg://wallboard:wallboard@127.0.0.1:5432/wallboard
      THREECX_BASE_URL: https://maxbit.3cx.asia
      THREECX_CLIENT_ID: dashboardamk
      TIMEZONE: Asia/Phnom_Penh
      # THREECX_CLIENT_SECRET comes from a Codespaces secret or a .env file in the repo root
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallboard
      POSTGRES_USER: wallboard
      POSTGRES_PASSWORD: wallboard
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
